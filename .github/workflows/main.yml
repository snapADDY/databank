name: Test, build and publish wheels

on:
  push:
    tags: ["*"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Run unit tests
        run: uv run --group test --all-extras pytest tests

      - name: Build wheels
        run: uv build

      - name: Publish wheels
        run: uv publish --token ${{ secrets.PYPI_TOKEN }}
